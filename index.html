<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PvZ 物理防御战</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; user-select: none; }
  body { margin: 0; background: #2c3e20; color: #333; display: flex; justify-content: center; min-height: 100vh; }
  
  /* 登录界面 */
  #loginScreen { position: fixed; inset: 0; background: rgba(15, 25, 10, 0.95); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .login-box { background: #7b5b3f; border: 8px solid #5c402b; border-radius: 20px; padding: 30px; text-align: center; width: 90%; max-width: 340px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .login-box h2 { margin: 0 0 20px; color: #ffd166; text-shadow: 2px 2px 0 #3a2210; }
  .login-box input { width: 100%; padding: 12px; margin-bottom: 16px; border-radius: 8px; border: 2px solid #4a3523; font-size: 16px; background: #f4f1ea; outline: none; }
  .login-btn { width: 100%; padding: 14px; border: none; border-radius: 8px; background: #4caf50; color: #fff; font-size: 18px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 #2e7d32; }
  .login-btn:active { transform: translateY(4px); box-shadow: none; }

  /* 主界面 */
  #gameScreen { display: none; width: 100%; max-width: 900px; padding: 10px; flex-direction: column; gap: 10px; background: #4e7c35; min-height: 100vh; }
  #gameScreen.active { display: flex; }
  
  .top-bar { display: flex; justify-content: space-between; align-items: center; background: #3a2210; padding: 8px 16px; border-radius: 12px; border: 2px solid #ffd166; color: #fff; font-size: 14px; flex-wrap: wrap; gap: 8px;}
  .top-bar span { color: #ffd166; font-weight: bold; }
  .quiz-btn { background: #ff9800; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 0 #e65100; font-size: 14px; }
  
  .card-area { display: flex; gap: 8px; background: #7b5b3f; padding: 8px; border-radius: 12px; min-height: 70px; overflow-x: auto; align-items: center; }
  .empty-cards { color: #c4b5a0; font-size: 14px; margin-left: 10px; }
  .card { width: 50px; height: 60px; background: #f4f1ea; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: 2px solid transparent; flex-shrink: 0; }
  .card.selected { border-color: #ffd166; transform: scale(1.05); box-shadow: 0 0 10px #ffd166; }
  .card .emoji { font-size: 24px; }
  .card .name { font-size: 10px; font-weight: bold; color: #333; margin-top: 2px; }

  .game-board { display: flex; flex: 1; border: 4px solid #3e612a; border-radius: 12px; overflow: hidden; background: #88c053; position: relative; min-height: 400px; }
  .mower-track { width: 40px; background: #6b4e3d; display: flex; flex-direction: column; border-right: 2px dashed #5c402b; }
  .mower-slot { height: 20%; display: flex; align-items: center; justify-content: center; font-size: 24px; transition: transform 0.3s; }
  .mower-slot.empty { opacity: 0; }
  
  .lawn { flex: 1; position: relative; background-image: linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px); background-size: calc(100% / 9) 20%; cursor: crosshair; overflow: hidden; }
  
  .plant, .zombie, .bullet, .explosion { position: absolute; width: calc(100% / 9); height: 20%; display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .zombie { font-size: 32px; z-index: 10; transition: none; }
  .zombie.slowed { filter: hue-rotate(180deg); }
  .bullet { font-size: 16px; z-index: 5; transition: none; }
  
  .hp-bar { position: absolute; top: 5px; width: 80%; height: 6px; background: #333; border-radius: 3px; overflow: hidden; opacity: 0; }
  .zombie .hp-bar { opacity: 1; }
  .hp-fill { height: 100%; background: #e53935; transition: width 0.1s; }
  
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 200; padding: 16px; }
  .modal.active { display: flex; }
  
  .quiz-card { width: 100%; max-width: 440px; background: #f4f1ea; border-radius: 16px; padding: 20px; border: 6px solid #7b5b3f; max-height: 90vh; overflow-y: auto; }
  .quiz-image-wrap { text-align: center; margin-bottom: 12px; }
  .quiz-image-wrap img { max-width: 100%; max-height: 180px; border-radius: 8px; background: #fff; display: none; }
  .quiz-card h3 { margin: 0 0 15px; font-size: 16px; line-height: 1.5; }
  .option { display: block; width: 100%; margin-top: 10px; padding: 12px; font-size: 14px; text-align: left; background: #e0d6c8; border: 2px solid #c4b5a0; border-radius: 8px; cursor: pointer; }
  .option.selected { background: #bbdefb; border-color: #42a5f5; }
  .option.right { background: #a5d6a7; border-color: #4caf50; }
  .option.wrong { background: #ef9a9a; border-color: #e53935; }
  .quiz-submit { width: 100%; margin-top: 15px; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; background: #4caf50; color: #fff; cursor: pointer; }

  .blindbox-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 300; }
  .blindbox-modal.active { display: flex; }
  .box { font-size: 100px; cursor: pointer; animation: shake 0.5s infinite; }
  .reward-plant { font-size: 100px; animation: pop 0.5s ease-out forwards; }
  @keyframes pop { 0%{transform: scale(0)} 70%{transform: scale(1.2)} 100%{transform: scale(1)} }
  .reward-text { color: #ffd166; font-size: 24px; font-weight: bold; margin-top: 20px; text-align: center; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px) rotate(-5deg)} 75%{transform:translateX(10px) rotate(5deg)} }
  
  .plant-info-card { width: 90%; max-width: 340px; background: #f4f1ea; border-radius: 16px; padding: 30px 20px; text-align: center; border: 6px solid #7b5b3f; }

  .sidebar { width: 100%; max-width: 280px; margin: 0 auto; background: rgba(30,40,20,0.85); border-radius: 12px; padding: 15px; border: 2px solid #4e7c35; color: #fff;}
  .sidebar h3 { margin: 0 0 10px; color: #ffd166; text-align: center; font-size: 16px; border-bottom: 1px solid #4e7c35; padding-bottom: 8px;}
  #leaderboard { list-style: none; padding: 0; margin: 0; font-size: 13px;}
  #leaderboard li { display: flex; justify-content: space-between; padding: 8px 10px; background: rgba(255,255,255,0.05); border-radius: 6px; margin-bottom: 6px;}
  #leaderboard li:nth-child(1) { background: rgba(255,209,102,0.2); border: 1px solid #ffd166;}
  #leaderboard li:nth-child(2) { background: rgba(192,192,192,0.2); }
  #leaderboard li:nth-child(3) { background: rgba(205,127,50,0.2); }

  /* 结算与错题面板 */
  #resultModal .quiz-card { max-width: 500px; }
  .wrong-q-item { background: #fff; border: 1px solid #ccc; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px;}
  .wrong-q-item img { max-width: 100%; max-height: 120px; margin: 8px 0; border-radius: 4px; }
  .wrong-q-title { font-weight: bold; margin-bottom: 6px; line-height: 1.4;}
  
  /* 教师端界面 */
  #teacherScreen { display: none; width: 100%; max-width: 900px; padding: 20px; background: #fff; min-height: 100vh; flex-direction: column; }
  #teacherScreen.active { display: flex; }
  .teacher-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; padding-bottom: 10px; margin-bottom: 20px;}
  .teacher-table { width: 100%; border-collapse: collapse; margin-top: 10px;}
  .teacher-table th, .teacher-table td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px;}
  .teacher-table th { background: #f4f4f4; font-weight: bold; }

</head>
<body>

<!-- 登录界面 -->
<div id="loginScreen">
  <div class="login-box">
    <h2>🌻 物理防御战 🌻</h2>
    <input type="text" id="playerName" placeholder="请输入你的姓名">
    <input type="text" id="playerClass" placeholder="请输入你的班级">
    <button class="login-btn" onclick="login()">进入草坪</button>
    <div style="font-size:12px; color:#aaa; margin-top:15px;">* 每个设备仅能绑定一个ID</div>
  </div>
</div>

<!-- 主游戏界面 -->
<div id="gameScreen">

  </div>

  <div class="card-area" id="cardArea">
    <div class="empty-cards">还没有植物，请点击右上角答题获取盲盒！</div>
  </div>

  <div class="game-board">
    <div class="mower-track" id="mowerTrack">
      <div class="mower-slot" id="mower-0">🚜</div>
      <div class="mower-slot" id="mower-1">🚜</div>
      <div class="mower-slot" id="mower-2">🚜</div>
      <div class="mower-slot" id="mower-3">🚜</div>
      <div class="mower-slot" id="mower-4">🚜</div>
    </div>
    <div class="lawn" id="lawn"></div>
  </div>

  <div class="sidebar">
    <h3>🏆 实时排行榜</h3>
    <ul id="leaderboard"><li style="text-align:center; opacity:0.6;">加载中...</li></ul>
  </div>
</div>

<!-- 答题弹窗 -->
<div class="modal" id="quizModal">
  <div class="quiz-card">
    <div class="quiz-image-wrap"><img id="quizImage" src=""></div>
    <h3 id="quizQuestion"></h3>
    <div id="quizOptions"></div>
    <button class="quiz-submit" id="quizSubmit" style="display:none;" onclick="submitAnswer()">提交答案</button>
  </div>
</div>

<!-- 盲盒弹窗 -->
<div class="blindbox-modal" id="blindboxModal">
  <div id="blindboxDisplay" class="box" onclick="openBlindbox()">🎁</div>
  <div id="rewardPlant" class="reward-plant" style="display:none;"></div>
  <div id="rewardText" class="reward-text" style="display:none;"></div>
</div>

<!-- 植物图鉴说明 -->
<div class="modal" id="plantInfoModal">
  <div class="plant-info-card">
    <div style="font-size: 70px; margin-bottom: 10px;" id="infoEmoji"></div>
    <h2 id="infoName" style="margin: 0 0 10px; color: #4caf50;"></h2>
    <div id="infoDesc" style="font-size: 16px; line-height: 1.6; color: #555; margin-bottom: 25px; padding: 10px; background: rgba(0,0,0,0.05); border-radius: 8px;"></div>
    <button class="quiz-submit" style="background:#4caf50;" onclick="closePlantInfo()">我知道了，开始种植！</button>
  </div>
</div>

<!-- 结算与错题回顾弹窗 -->
<div class="modal" id="resultModal">
  <div class="quiz-card">
    <h2 id="resultTitle" style="text-align:center; color:#4caf50; margin-top:0;">游戏结束</h2>
    <div id="resultScore" style="text-align:center; font-size:20px; font-weight:bold; margin-bottom:15px;">最终得分: 0</div>
    
    <div id="wrongQuestionsArea" style="max-height: 50vh; overflow-y: auto;">
      <!-- 错题动态渲染 -->
    </div>
    
    <button class="quiz-submit" onclick="location.reload()">返回主页</button>
  </div>
</div>

<!-- 教师端后台 -->
<div id="teacherScreen">
  <div class="teacher-header">
    <h1>👨‍🏫 教师控制台 - 学生错题本</h1>
    <button class="quiz-btn" style="background:#2196f3; box-shadow:none;" onclick="loadTeacherData()">刷新数据</button>
  </div>
  <table class="teacher-table">
    <thead>
      <tr>
        <th>时间</th>
        <th>班级</th>
        <th>姓名</th>
        <th>错题题干</th>
        <th>正确答案</th>
      </tr>
    </thead>
    <tbody id="teacherDataBody">
      <tr><td colspan="5" style="text-align:center;">正在加载数据...</td></tr>
    </tbody>
  </table>
</div>

function login() {
  const name = $('playerName').value.trim();
  const cls = $('playerClass').value.trim();
  if (!name || !cls) return alert('请填写姓名和班级！');
  
  state.name = name; state.class = cls;
  localStorage.setItem('pvz_user', JSON.stringify({name, class: cls}));
  enterGame();
}

function enterGame() {
  $('loginScreen').style.display = 'none';
  $('gameScreen').classList.add('active');
  $('uiName').textContent = state.name; $('uiClass').textContent = state.class;
  
  // 拉取该生历史最高分
  supabase.rpc('get_top_scores', { p_limit: 1000, p_offset: 0 }).then(({data}) => {
    const me = data?.find(p => p.name === state.name && p.class === state.class);
    if (me) { state.score = me.score; $('uiScore').textContent = state.score; }
  });

  fetchLeaderboard();
  setInterval(fetchLeaderboard, 10000);

  setTimeout(() => alert('欢迎来到物理草坪！请先点击右上角【答题获植物】，获得植物卡片后才能开始游戏！'), 500);
}

/* ================= 排行榜相关 ================= */
async function fetchLeaderboard() {
  const { data, error } = await supabase.rpc('get_top_scores', { p_limit: 20, p_offset: 0 });
  if (error) return;
  const ul = $('leaderboard');
  ul.innerHTML = '';
  (data || []).forEach((player, index) => {
    const li = document.createElement('li');
    li.innerHTML = `<span>${index + 1}. ${player.name} (${player.class})</span> <span>${player.score}分</span>`;
    ul.appendChild(li);
  });
}

async function updateScore(addScore) {
  state.score += addScore;
  $('uiScore').textContent = state.score;
  await supabase.rpc('submit_score', { p_name: state.name, p_class: state.class, p_score: state.score });
}

/* ================= 答题系统 ================= */
let currentQ = null, selectedOpts = new Set(), isAnswering = false, qPool = [];

function openQuiz() {
  if (state.zombies.length > 0) {
    if (!confirm('游戏正在进行中，答题会暂停游戏。是否继续？')) return;
  }
  state.isPlaying = false; 
  if (qPool.length === 0) {
    qPool = QUESTIONS.map((_, i) => i).sort(() => Math.random() - 0.5);
  }
  currentQ = QUESTIONS[qPool.pop()];
  selectedOpts.clear(); isAnswering = false;
  
  $('quizQuestion').textContent = currentQ.q;
  const img = $('quizImage');
  if (currentQ.image) {
    img.style.display = 'block';
    img.src = currentQ.image + '.png';
    img.onerror = function() { this.src = currentQ.image + '.jpg'; };
  } else {
    img.style.display = 'none';
  }
  
  const box = $('quizOptions');
  box.innerHTML = '';
  currentQ.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = String.fromCharCode(65 + i) + '. ' + opt;
    btn.onclick = () => onOptClick(i, btn);
    box.appendChild(btn);
  });
  
  $('quizSubmit').style.display = currentQ.multi ? 'block' : 'none';
  $('quizSubmit').disabled = true;
  $('quizModal').classList.add('active');
}

function onOptClick(i, btn) {
  if (isAnswering) return;
  if (currentQ.multi) {
    if (selectedOpts.has(i)) { selectedOpts.delete(i); btn.classList.remove('selected'); }
    else { selectedOpts.add(i); btn.classList.add('selected'); }
    $('quizSubmit').disabled = selectedOpts.size === 0;
  } else {
    selectedOpts = new Set([i]); btn.classList.add('selected');
    submitAnswer();
  }
}

function submitAnswer() {
  if (isAnswering || selectedOpts.size === 0) return;
  isAnswering = true;
  
  const isCorrect = selectedOpts.size === currentQ.answer.length && currentQ.answer.every(i => selectedOpts.has(i));
  const btns = [...$('quizOptions').children];
  btns.forEach((b, i) => {
    b.disabled = true;
    if (currentQ.answer.includes(i)) b.classList.add('right');
    else if (selectedOpts.has(i)) b.classList.add('wrong');
  });
  
  setTimeout(() => {
    $('quizModal').classList.remove('active');
    if (isCorrect) {
      updateScore(20);
      showBlindbox();
    } else {
      // 答错记录错题并增加僵尸速度
      state.wrongQuestions.push(currentQ);
      state.speedBonus += 0.1;
      $('uiSpeedBonus').textContent = '+' + state.speedBonus.toFixed(1);
      
      alert(`答错了！没有获得植物。\n⚠️ 僵尸被激怒了，移动速度永久增加 0.1 格/秒！`);
      resumeGame();
    }
  }, 1000);
}

/* ================= 盲盒与种植 ================= */
function showBlindbox() {
  $('blindboxDisplay').style.display = 'block';
  $('blindboxDisplay').textContent = '🎁';
  $('rewardPlant').style.display = 'none';
  $('rewardText').style.display = 'none';
  $('blindboxModal').classList.add('active');
}

function openBlindbox() {
  const box = $('blindboxDisplay');
  if (box.textContent === '💥') return;
  box.textContent = '💥';
  
  setTimeout(() => {
    box.style.display = 'none';
    const keys = Object.keys(PLANT_TYPES);
    const randType = keys[Math.floor(Math.random() * keys.length)];
    const plantData = PLANT_TYPES[randType];
    
    const isFirstTime = !state.unlockedPlants.includes(randType);
    if (isFirstTime) state.unlockedPlants.push(randType);
    
    state.cards.push({ id: Date.now(), type: randType });
    renderCards();
    
    $('rewardPlant').textContent = plantData.emoji;
    $('rewardPlant').style.display = 'block';
    $('rewardText').textContent = isFirstTime ? `✨ 首次获得新植物：${plantData.name}！` : `获得植物：${plantData.name}！`;
    $('rewardText').style.display = 'block';
    
    setTimeout(() => {
      $('blindboxModal').classList.remove('active');
      if (isFirstTime) { showPlantInfo(randType); } else { resumeGame(); }
    }, 2000);
  }, 800);
}

function showPlantInfo(type) {
  const p = PLANT_TYPES[type];
  $('infoEmoji').textContent = p.emoji;
  $('infoName').textContent = p.name;
  $('infoDesc').textContent = p.desc;
  $('plantInfoModal').classList.add('active');
}

function closePlantInfo() {
  $('plantInfoModal').classList.remove('active');
  resumeGame();
}

function resumeGame() {
  if (!state.isPlaying) {
    state.isPlaying = true;
    state.lastTime = performance.now();
    requestAnimationFrame(gameLoop);
  }
}

function renderCards() {
  const area = $('cardArea');
  area.innerHTML = '';
  if (state.cards.length === 0) {
    area.innerHTML = '<div class="empty-cards">卡槽为空，快去答题吧！</div>';
    return;
  }
  state.cards.forEach(c => {
    const p = PLANT_TYPES[c.type];
    const div = document.createElement('div');
    div.className = 'card' + (state.selectedCardId === c.id ? ' selected' : '');
    div.innerHTML = `<div class="emoji">${p.emoji}</div><div class="name">${p.name}</div>`;
    div.onclick = () => { state.selectedCardId = c.id; renderCards(); };
    area.appendChild(div);
  });
}

lawn.onclick = (e) => {
  if (!state.selectedCardId) return;
  const rect = lawn.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const col = Math.floor(x / (rect.width / COLS));
  const row = Math.floor(y / (rect.height / ROWS));
  
  if (state.plants.find(p => p.row === row && p.col === col)) return;
  const cardIdx = state.cards.findIndex(c => c.id === state.selectedCardId);
  if (cardIdx === -1) return;
  
  const type = state.cards[cardIdx].type;
  state.plants.push({
    id: Date.now() + Math.random(), type, row, col,
    hp: PLANT_TYPES[type].hp, maxHp: PLANT_TYPES[type].hp, cd: 0
  });
  state.cards.splice(cardIdx, 1);
  state.selectedCardId = null;
  renderCards();
};

/* ================= 游戏主循环 ================= */
function gameLoop(timestamp) {
  if (!state.isPlaying) return;
  if (!state.lastTime) state.lastTime = timestamp;
  let dt = (timestamp - state.lastTime) / 1000;
  state.lastTime = timestamp;
  if (dt > 0.1) dt = 0.1;
  
  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}

function update(dt) {
  // 1. 生成僵尸
  if (state.spawnedZombies < 20) {
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      spawnZombie();
      state.spawnedZombies++;
      $('zombieProgress').textContent = `${state.spawnedZombies}/20`;
      state.spawnTimer = 4 + Math.random() * 2;
    }
  }
  
  // 2. 僵尸移动与攻击
  for (let i = state.zombies.length - 1; i >= 0; i--) {
    let z = state.zombies[i];
    if (z.slowTimer > 0) z.slowTimer -= dt;
    let currentBaseSpeed = z.speed + state.speedBonus;
    let speed = z.slowTimer > 0 ? currentBaseSpeed * 0.8 : currentBaseSpeed;
    
    let col = Math.floor(z.x);
    let plant = state.plants.find(p => p.row === z.row && p.col === col);
    
    if (plant) {
      z.attackTimer = (z.attackTimer || 0) - dt;
      if (z.attackTimer <= 0) {
        z.attackTimer = 1.0;
        plant.hp -= 1;
        if (plant.hp <= 0) state.plants = state.plants.filter(p => p.id !== plant.id);
      }
    } else {
      z.x -= speed * dt;
      if (z.x <= 0.2) {
        if (state.lawnmowers[z.row]) {
          state.lawnmowers[z.row] = false;
          $('mower-' + z.row).classList.add('empty');
          state.zombies = state.zombies.filter(zz => zz.row !== z.row);
          break;
        } else { gameOver(false); return; }
      }
    }
  }
  
  // 3. 植物攻击
  state.plants.forEach(p => {
    p.cd -= dt;
    if (p.cd <= 0) {
      let targets = state.zombies.filter(z => z.row === p.row && z.x > p.col);
      if (targets.length > 0) {
        targets.sort((a,b) => a.x - b.x);
        let target = targets[0];
        
        if (p.type === 'cannon') {
          target.hp -= 100; p.cd = 10;
          let ex = document.createElement('div'); ex.className = 'explosion'; ex.textContent = '💥';
          ex.style.left = (target.x * (100/9)) + '%'; ex.style.top = (target.row * 20) + '%';
          lawn.appendChild(ex); setTimeout(() => ex.remove(), 300);
        } else if (p.type === 'wallnut') {
          // 坚果不攻击
        } else {
          state.bullets.push({
            id: Date.now() + Math.random(), row: p.row, x: p.col + 0.5,
            dmg: PLANT_TYPES[p.type].dmg, freeze: PLANT_TYPES[p.type].freeze || false,
            emoji: p.type === 'cornpult' ? '🌽' : (p.type === 'snowpea' ? '❄️' : '🟢')
          });
          p.cd = PLANT_TYPES[p.type].cooldown;
        }
        
        if (target.hp <= 0) {
          state.zombies = state.zombies.filter(z => z.id !== target.id);
          updateScore(10);
        }
      }
    }
  });
  
  // 4. 子弹移动
  for (let i = state.bullets.length - 1; i >= 0; i--) {
    let b = state.bullets[i]; b.x += 10 * dt;
    let hit = false;
    for (let z of state.zombies) {
      if (z.row === b.row && b.x >= z.x && b.x <= z.x + 0.8) {
        z.hp -= b.dmg;
        if (b.freeze) z.slowTimer = 2.0;
        hit = true;
        if (z.hp <= 0) {
          state.zombies = state.zombies.filter(zz => zz.id !== z.id);
          updateScore(10);
        }
        break;
      }
    }
    if (hit || b.x > 9.5) state.bullets.splice(i, 1);
  }
  
  if (state.spawnedZombies >= 20 && state.zombies.length === 0) gameOver(true);
}

function spawnZombie() {
  const row = Math.floor(Math.random() * 5);
  const rand = Math.random();
  let type = 'normal';
  // 概率分布：普通 50%，路障 30%，铁桶 15%，橄榄球 5%
  if (rand > 0.95) type = 'football';
  else if (rand > 0.80) type = 'bucket';
  else if (rand > 0.50) type = 'cone';
  
  state.zombies.push({
    id: Date.now() + Math.random(), row, x: 9.5,
    hp: ZOMBIE_TYPES[type].hp, maxHp: ZOMBIE_TYPES[type].hp,
    speed: ZOMBIE_TYPES[type].speed, emoji: ZOMBIE_TYPES[type].emoji,
    slowTimer: 0, attackTimer: 0
  });
}

function render() {
  let plantsHtml = '', zombiesHtml = '', bulletsHtml = '';
  state.plants.forEach(p => {
    plantsHtml += `<div class="plant" style="left:${p.col * (100/9)}%; top:${p.row * 20}%"><div style="font-size:28px">${PLANT_TYPES[p.type].emoji}</div></div>`;
  });
  state.zombies.forEach(z => {
    const hpPct = Math.max(0, z.hp / z.maxHp * 100);
    zombiesHtml += `<div class="zombie ${z.slowTimer > 0 ? 'slowed' : ''}" style="left:${z.x * (100/9)}%; top:${z.row * 20}%">
      <div class="hp-bar"><div class="hp-fill" style="width:${hpPct}%"></div></div><div>${z.emoji}</div></div>`;
  });
  state.bullets.forEach(b => {
    bulletsHtml += `<div class="bullet" style="left:${b.x * (100/9)}%; top:${b.row * 20}%">${b.emoji}</div>`;
  });
  
  let container = $('entityLayer');
  if (!container) {
    container = document.createElement('div'); container.id = 'entityLayer';
    container.style.cssText = 'position:absolute; inset:0; pointer-events:none;';
    lawn.appendChild(container);
  }
  container.innerHTML = plantsHtml + zombiesHtml + bulletsHtml;
}

/* ================= 结算与错题上传 ================= */
async function gameOver(isWin) {
  state.isPlaying = false;
  
  // 1. 结算界面展示
  $('resultTitle').textContent = isWin ? '🎉 挑战成功！' : '💀 僵尸吃掉了你的脑子！';
  $('resultTitle').style.color = isWin ? '#4caf50' : '#e53935';
  $('resultScore').textContent = `最终得分：${state.score}`;
  
  const wrongArea = $('wrongQuestionsArea');
  if (state.wrongQuestions.length === 0) {
    wrongArea.innerHTML = '<div style="text-align:center; color:#888;">本局全对，太棒啦！</div>';
  } else {
    wrongArea.innerHTML = '<h4 style="margin:0 0 10px 0; color:#e53935;">本局错题回顾：</h4>';
    state.wrongQuestions.forEach((q, idx) => {
      let imgHtml = '';
      if (q.image) {
        imgHtml = `<img src="${q.image}.png" onerror="this.src='${q.image}.jpg'">`;
      }
      wrongArea.innerHTML += `
        <div class="wrong-q-item">
          <div class="wrong-q-title">${idx + 1}. ${q.q}</div>
          ${imgHtml}
          <div style="color:#4caf50; font-weight:bold;">正确答案：${q.answer.map(i => String.fromCharCode(65 + i)).join('')}</div>
        </div>
      `;
    });
  }
  $('resultModal').classList.add('active');
  
  // 2. 将错题上传到云端
  if (state.wrongQuestions.length > 0) {
    const records = state.wrongQuestions.map(q => ({
      student_name: state.name,
      student_class: state.class,
      question_text: q.q,
      options: q.options.join(' | '),
      correct_answer: q.answer.map(i => String.fromCharCode(65 + i)).join('')
    }));
    await supabase.from('wrong_questions').insert(records);
  }
}

/* ================= 教师端后台逻辑 ================= */
async function loadTeacherData() {
  const tbody = $('teacherDataBody');
  tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">正在加载数据...</td></tr>';
  
  const { data, error } = await supabase
    .from('wrong_questions')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(200); // 只看最近200条

  if (error) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">加载失败，请检查网络</td></tr>';
    return;
  }
  
  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">暂无学生错题记录</td></tr>';
    return;
  }

  tbody.innerHTML = '';
  data.forEach(row => {
    const date = new Date(row.created_at).toLocaleString();
    tbody.innerHTML += `
      <tr>
        <td>${date}</td>
        <td>${row.student_class}</td>
        <td>${row.student_name}</td>
        <td style="max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${row.question_text}">${row.question_text}</td>
        <td style="color:#4caf50; font-weight:bold;">${row.correct_answer}</td>
      </tr>
    `;
  });
}
